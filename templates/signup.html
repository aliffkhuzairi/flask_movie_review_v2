<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Sign Up</title>
</head>
<body>
     <div class="auth-shell">
         <div class="auth-card">
             <h1>Create Account</h1>

             <div class="flash-container">
                 {% with messages = get_flashed_messages(with_categories=true, category_filter=['success-auth', 'error-auth', 'warning-auth']) %}
                    {% if messages %}
                        {% for category, msg in messages %}
                            <div class="flash {{ category.split('-')[0] }}">{{ msg }}</div>
                        {% endfor %}
                    {% endif %}
                 {% endwith %}
             </div>

             <form action="{{ url_for('auth.signup') }}" method="POST" class="form-grid">


                 <label for="id">ID:</label>
                 <input id="id" type="text" name="user_id" required>

                 <label for="password">Password:</label>
                 <div class="password-field">
                     <input id="password" type="password" name="password" required>
                     <button type="button"
                             class="password-toggle"
                             aria-label="Show password">
                        <i class="fa-solid fa-eye"></i>
                     </button>
                 </div>


                 <div class="button-row">
                     <button type="submit" class="button-link primary">Sign Up</button>
                 </div>

             </form>

             <p class="small-text">
                Already have an account?
                <a href="{{ url_for('auth.index') }}" class="auth-option">Sign in</a>
             </p>
         </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>

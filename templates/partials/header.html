<header class="header">
    <div class="header-wrap">
        <div class="header-left">
            <a href="{{ url_for('movie.home') }}" class="brand">
                <span>MovieReview</span>
            </a>
        </div>

        <div class="header-right">
            <div class="button-row nav-actions" id="navMenu">
                <a class="button-link nav" href="{{ url_for('movie.movie_list') }}">Movies</a>
                <a class="button-link nav" href="{{ url_for('user.user_detail', user_id=user_id) }}">Profile</a>
                <a class="button-link logout" href="{{ url_for('auth.logout') }}">Logout</a>
            </div>

            <form class="header-search-form" id="headerSearchForm"
                  action="{{ url_for('search.global_search') }}"
                  method="GET">
                <input type="text" name="q"
                       placeholder="Search movies or users" value="{{ query|default('') }}"/>
                <button type="submit" aria-label="Search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </form>

            <button class="header-search-toggle" type="button" onclick="toggleHeaderSearch(this)" aria-label="Toggle search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button class="menu-toggle" type="button" onclick="toggleMenu(this)">
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>
    </div>
</header>
